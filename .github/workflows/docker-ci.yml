name: Flask Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v

      # NUCLEAR OPTION: Strip all hidden spaces and newlines from secrets
      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_TOKEN }}
        run: |
          CLEAN_USER=$(echo "$DOCKER_USER" | tr -d '[:space:]')
          CLEAN_PASS=$(echo "$DOCKER_PASS" | tr -d '[:space:]')
          echo "$CLEAN_PASS" | docker login -u "$CLEAN_USER" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flask-docker-ci:latest